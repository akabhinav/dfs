# Distributed File System Configuration

# Block size in bytes (default: 128 MB)
dfs.block.size=134217728

# Replication factor (default: 3)
dfs.replication.factor=3

# NameNode configuration
dfs.namenode.host=localhost
dfs.namenode.port=9000

# DataNode configuration
dfs.datanode.port=9001

# Heartbeat configuration (milliseconds)
dfs.heartbeat.interval=3000
dfs.heartbeat.timeout=10000

# Data directory
dfs.data.dir=./dfs-data
